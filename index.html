<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel Interno</title>
  <style>
    body{font-family:Arial,sans-serif;background:#eef2f7;margin:0;padding:20px;color:#1a1a2e}
    .card{background:#fff;border:1px solid #d0dcea;border-radius:12px;padding:16px;margin-bottom:16px;max-width:900px}
    input,select{width:100%;padding:10px;border:1px solid #d0dcea;border-radius:8px;margin-top:6px;margin-bottom:12px}
    button{padding:10px 14px;border:0;border-radius:8px;background:#1a2744;color:#fff;cursor:pointer}
    h2{margin-top:0}
    .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    @media(max-width:700px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="card">
    <h2>Materiales</h2>
    <div class="grid">
      <div><label>ID</label><input id="m_id"></div>
      <div><label>Categoría</label><input id="m_cat"></div>
      <div><label>Nombre</label><input id="m_nom"></div>
    </div>
    <button onclick="saveMaterial()">Guardar material</button>
  </div>

  <div class="card">
    <h2>Localidades</h2>
    <div class="grid">
      <div><label>ID</label><input id="l_id"></div>
      <div><label>Provincia</label><input id="l_prov"></div>
      <div><label>Localidad</label><input id="l_loc"></div>
    </div>
    <div class="grid">
      <div><label>Zona</label><input id="l_zona"></div>
      <div><label>Activo</label><select id="l_act"><option value="TRUE">TRUE</option><option value="FALSE">FALSE</option></select></div>
    </div>
    <button onclick="saveLocalidad()">Guardar localidad</button>
  </div>

  <script>
    async function post(action, data) {
      const res = await fetch(location.href, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({action, data})
      });
      if (!res.ok) throw new Error('Error al guardar');
      alert('Guardado');
    }

    function saveMaterial() {
      post('saveMaterial', {
        id: document.getElementById('m_id').value,
        categoria: document.getElementById('m_cat').value,
        nombre: document.getElementById('m_nom').value
      });
    }

    function saveLocalidad() {
      post('saveLocalidad', {
        id: document.getElementById('l_id').value,
        provincia: document.getElementById('l_prov').value,
        localidad: document.getElementById('l_loc').value,
        zona: document.getElementById('l_zona').value,
        activo: document.getElementById('l_act').value
      });
    }
  </script>
</body>
</html>
