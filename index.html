<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Materiales Ya</title>
  <style>
    body{font-family:Arial,sans-serif;background:#eef2f7;color:#1a1a2e;margin:0}
    header,footer{background:#1a2744;color:#fff;padding:16px 20px}
    main{max-width:1000px;margin:24px auto;padding:0 16px}
    .card{background:#fff;border:1px solid #d0dcea;border-radius:12px;padding:20px;margin-bottom:16px}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:700px){.grid-2{grid-template-columns:1fr}}
    label{display:block;font-size:12px;color:#666;margin-bottom:6px}
    input,select,textarea,button{font:inherit}
    input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d0dcea;border-radius:8px;background:#fafbfd}
    button{cursor:pointer;border:0}
    .btn{width:100%;padding:12px;border-radius:8px;background:#1a2744;color:#fff;font-weight:600;margin-top:10px}
    .btn2{width:100%;padding:11px;border-radius:8px;background:#fff;border:1px solid #ddd;color:#444;margin-top:8px}
    .status{font-size:13px;color:#666;margin:8px 0 12px}
    .error{color:#b00020}
    .row{display:grid;grid-template-columns:2fr 80px 100px 34px;gap:8px;align-items:center;margin-bottom:8px}
    .row input{padding:8px 10px}
    .small{font-size:12px;color:#666}
    .tabs{display:flex;gap:8px;flex-wrap:wrap}
    .tab{padding:8px 12px;border:1px solid #d0dcea;background:#fff;border-radius:8px}
    .tab.active{background:#1a2744;color:#fff;border-color:#1a2744}
    .pill{padding:8px 12px;border:1px solid #d0dcea;background:#f5f8fc;border-radius:999px}
    .hidden{display:none}
    .okbox{text-align:center;padding:20px 10px}
    .code{font-family:monospace;font-size:28px;font-weight:700;letter-spacing:3px;background:#eef2f7;display:inline-block;padding:10px 20px;border-radius:10px;margin:12px 0}
    a.whatsapp{display:block;background:#25d366;color:#fff;text-decoration:none;padding:13px 16px;border-radius:8px;font-weight:700;text-align:center}
    .wsp-wrap{position:relative}
    .wsp-trigger{padding:10px 12px;border:1px solid #d0dcea;border-radius:8px;background:#fafbfd;color:#666;cursor:pointer}
    .wsp-input{margin-top:8px}
    .debug{
      background:#0f172a;color:#e2e8f0;border-radius:10px;padding:10px 12px;
      font-family:monospace;font-size:12px;white-space:pre-wrap;min-height:42px;margin-top:10px
    }
  </style>
</head>
<body>
<header><strong>Materiales Ya</strong></header>

<main>
  <div id="step1" class="card">
    <h2>Datos del cliente</h2>
    <div class="grid-2">
      <div><label>Nombre</label><input id="cli-nombre" type="text" placeholder="Juan Pérez"></div>
      <div>
        <label>WhatsApp</label>
        <div id="wsp-wrap" class="wsp-wrap">
          <div id="wsp-trigger" class="wsp-trigger">Tocá para ingresar tu WhatsApp</div>
          <input type="tel" id="cli-tel" class="wsp-input hidden" placeholder="11 1234-5678">
        </div>
      </div>
    </div>
    <div style="margin-top:12px"><label>Localidad</label><select id="cli-zona"><option value="">Cargando...</option></select></div>
    <div style="margin-top:12px"><label>Dirección</label><input id="cli-dir" type="text" placeholder="Av. Corrientes 1234"></div>
    <div style="margin-top:12px"><label>Urgencia</label>
      <select id="cli-urgencia">
        <option value="urgente">Lo antes posible</option>
        <option value="semana">Esta semana</option>
        <option value="quincena">Esta quincena</option>
        <option value="mes">Este mes</option>
      </select>
    </div>
    <button class="btn" onclick="irPaso2()">Continuar</button>
  </div>

  <div id="step2" class="card hidden">
    <h2>Pedido</h2>
    <div id="api-status" class="status">Sincronizando datos...</div>
    <div id="debug" class="debug">Esperando carga...</div>

    <h3>Categorías</h3>
    <div id="cats-nivel1" class="tabs"></div>

    <h3 style="margin-top:14px">Materiales</h3>
    <div id="cats-nivel2" class="tabs"></div>

    <div id="mats-grid" class="tabs" style="margin-top:10px"></div>

    <hr style="margin:16px 0;border:none;border-top:1px solid #eee">

    <div class="small" style="margin-bottom:8px">Lista de materiales</div>
    <div class="row" style="font-size:12px;color:#999;font-weight:700">
      <div>Material</div><div>Cant.</div><div>Unidad</div><div></div>
    </div>
    <div id="items-container"></div>
    <button type="button" class="btn2" onclick="addItem()">+ Agregar manualmente</button>

    <div style="margin-top:14px">
      <label>Observaciones</label>
      <textarea id="cli-obs" rows="3" placeholder="Entrega, horario, acceso, etc."></textarea>
    </div>

    <button id="btn-enviar-pedido" class="btn" onclick="enviarPedido()">Enviar pedido</button>
    <button class="btn2" onclick="irPaso1()">Volver</button>
  </div>

  <div id="step3" class="card hidden">
    <div class="okbox">
      <div style="font-size:42px">✅</div>
      <h2>¡Pedido enviado!</h2>
      <div id="codigo-pedido" class="code"></div>
      <p>Se guardó en Sheets y ya podés enviar el WhatsApp.</p>
      <a id="btn-wsp" class="whatsapp" target="_blank">Enviar por WhatsApp</a>
      <button class="btn2" onclick="nuevoPedido()">Hacer otro pedido</button>
    </div>
  </div>
</main>

<footer>Materiales Ya</footer>

<script>
  const URL_API = 'https://script.google.com/macros/s/AKfycbymxkGY-J6A_wXMTTvUoPqTyXFj4FbGo0qhx9flzDILLx5gcHQJb2n1kYQLOZ2G15Rdzg/exec';
  const TEL_ADMIN = '5491112345678';
  let materialesData = [];
  let corralonesData = [];

  function logDebug(msg){
    const el = document.getElementById('debug');
    el.textContent = String(msg);
  }

  function irPaso1(){ step1.classList.remove('hidden'); step2.classList.add('hidden'); step3.classList.add('hidden'); }
  function irPaso2(){ if(!cli_nombre.value.trim()){ alert('Ingresá tu nombre'); return; } if(!cli_zona.value){ alert('Seleccioná tu localidad'); return; } step1.classList.add('hidden'); step2.classList.remove('hidden'); step3.classList.add('hidden'); }

  function addItem(mat='', cant='1', u='unidades'){
    const c = document.getElementById('items-container');
    const d = document.createElement('div');
    d.className = 'row';
    d.innerHTML = `<input type="text" value="${mat}" placeholder="Material"><input type="number" min="1" value="${cant}"><input type="text" value="${u}"><button type="button" onclick="removeItem(this)" style="border-radius:6px;background:#fff;border:1px solid #ddd;height:34px">×</button>`;
    c.appendChild(d);
  }

  function removeItem(btn){
    const rows = document.querySelectorAll('.row');
    if(rows.length>1) btn.closest('.row').remove();
    else{
      const inputs = btn.closest('.row').querySelectorAll('input');
      inputs[0].value=''; inputs[1].value='1'; inputs[2].value='unidades';
    }
  }

  function setupWhatsAppField() {
    const trigger = document.getElementById('wsp-trigger');
    const input = document.getElementById('cli-tel');
    const showInput = () => { trigger.classList.add('hidden'); input.classList.remove('hidden'); input.focus(); };
    trigger.addEventListener('click', showInput);
    trigger.addEventListener('touchstart', showInput, { passive: true });
  }

  async function cargarCatalogo(){
    const s = document.getElementById('api-status');
    try{
      s.textContent = 'Sincronizando datos...';
      logDebug('Cargando API...');
      const res = await fetch(`${URL_API}?mode=api&t=${Date.now()}`);
      const txt = await res.text();
      logDebug(txt.slice(0, 400));

      if(!res.ok) throw new Error('HTTP '+res.status);

      const data = JSON.parse(txt);
      if (!data.ok) throw new Error(data.error || 'Respuesta inválida');

      materialesData = Array.isArray(data.materiales) ? data.materiales : [];
      corralonesData = Array.isArray(data.corralones) ? data.corralones : [];

      logDebug(`materiales=${materialesData.length}\ncorralones=${corralonesData.length}`);

      cargarCorralones();
      renderCatalogo();
      s.textContent = `OK: ${materialesData.length} materiales, ${corralonesData.length} localidades.`;
    }catch(e){
      s.innerHTML = `<span class="error">Error de conexión con Sheets: ${e.message}</span>`;
      logDebug('ERROR: ' + e.message);
      document.getElementById('cli-zona').innerHTML = '<option value="">No se pudieron cargar las localidades</option>';
    }
  }

  function cargarCorralones(){
    const sel = document.getElementById('cli-zona');
    const opciones = [...new Set(corralonesData.map(x => String(x.localidad || x.zona || x.corralon || '').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
    sel.innerHTML = '<option value="">Seleccioná tu localidad...</option>' + opciones.map(z => `<option value="${z}">${z}</option>`).join('');
  }

  function renderCatalogo(){
    const cats1 = document.getElementById('cats-nivel1');
    const cats2 = document.getElementById('cats-nivel2');
    const grid = document.getElementById('mats-grid');
    cats1.innerHTML=''; cats2.innerHTML=''; grid.innerHTML='';
    const categorias = [...new Set(materialesData.map(m => String(m.categoria || '').trim()).filter(Boolean))];
    if(!categorias.length){ grid.innerHTML = '<div class="small">No hay materiales cargados.</div>'; return; }

    categorias.forEach((cat, idx)=>{
      const b = document.createElement('button');
      b.className = 'tab' + (idx===0 ? ' active' : '');
      b.textContent = cat;
      b.onclick = ()=>renderMateriales(cat, b);
      cats1.appendChild(b);
    });
    renderMateriales(categorias[0], cats1.firstChild);
  }

  function renderMateriales(cat, btnTab){
    const cats2 = document.getElementById('cats-nivel2');
    const grid = document.getElementById('mats-grid');
    document.querySelectorAll('#cats-nivel1 .tab').forEach(b => b.classList.remove('active'));
    if (btnTab) btnTab.classList.add('active');
    cats2.innerHTML=''; grid.innerHTML='';
    const items = materialesData.filter(m => String(m.categoria || '').trim() === cat);

    items.forEach((item, idx)=>{
      const name = String(item.nombre || '').trim();
      if(!name) return;
      const b = document.createElement('button');
      b.className = 'tab' + (idx===0 ? ' active' : '');
      b.textContent = name;
      b.onclick = ()=>{
        grid.innerHTML = '';
        const unidad = item.unidad ? String(item.unidad) : 'unidades';
        const p = document.createElement('button');
        p.className = 'pill';
        p.textContent = `${name} (${unidad})`;
        p.onclick = ()=>addItem(name,'1',unidad);
        grid.appendChild(p);
      };
      cats2.appendChild(b);
    });

    const first = cats2.querySelector('.tab');
    if(first) first.click();
  }

  async function enviarPedido(){
    const rows = document.querySelectorAll('#items-container .row');
    const items = [];
    rows.forEach(row=>{
      const i = row.querySelectorAll('input');
      const mat = i[0].value.trim();
      if(mat) items.push({ mat, cant: i[1].value || '1', u: i[2].value || 'unidades' });
    });
    if(!items.length){ alert('Agregá al menos un material'); return; }

    const codigo = 'MAT-' + Date.now().toString().slice(-6);
    document.getElementById('codigo-pedido').textContent = codigo;

    const payload = {
      codigo,
      nombre: cli_nombre.value.trim(),
      tel: cli_tel.value.trim(),
      zona: cli_zona.value.trim(),
      dir: cli_dir.value.trim(),
      urgencia: cli_urgencia.options[cli_urgencia.selectedIndex].text,
      obs: cli_obs.value.trim(),
      items: JSON.stringify(items),
      fecha: new Date().toISOString()
    };

    const btn = document.getElementById('btn-enviar-pedido');
    btn.disabled = true; btn.textContent = 'Enviando...';

    try{
      const res = await fetch(URL_API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'savePedido', data: payload })
      });
      const txt = await res.text();
      let data;
      try { data = JSON.parse(txt); } catch (e) { throw new Error('Respuesta no JSON: ' + txt.slice(0,120)); }
      if(!res.ok || !data.ok) throw new Error(data.error || 'Error al guardar');

      const msg = `🏗 *NUEVO PEDIDO ${codigo}*\n\n👤 *Cliente:* ${payload.nombre}\n${payload.tel ? `📱 *WhatsApp:* ${payload.tel}\n` : ''}📍 *Localidad:* ${payload.zona}${payload.dir ? ' — ' + payload.dir : ''}\n⏰ *Urgencia:* ${payload.urgencia}\n\n📦 *Materiales:*\n` + items.map(i=>`• ${i.mat}: ${i.cant} ${i.u}`).join('\n') + (payload.obs ? `\n\n📝 *Obs:* ${payload.obs}` : '');

      document.getElementById('btn-wsp').href = `https://wa.me/${TEL_ADMIN}?text=${encodeURIComponent(msg)}`;
      step1.classList.add('hidden'); step2.classList.add('hidden'); step3.classList.remove('hidden');
      logDebug('Pedido guardado OK');
    }catch(e){
      alert('No se pudo guardar el pedido: ' + e.message);
      logDebug('POST ERROR: ' + e.message);
      console.error(e);
    }finally{
      btn.disabled = false; btn.textContent = 'Enviar pedido';
    }
  }

  function nuevoPedido(){
    document.getElementById('cli-nombre').value = '';
    document.getElementById('cli-tel').value = '';
    document.getElementById('cli-dir').value = '';
    document.getElementById('cli-obs').value = '';
    document.getElementById('cli-zona').value = '';
    document.getElementById('cli-urgencia').value = 'urgente';
    document.getElementById('items-container').innerHTML = '';
    document.getElementById('cli-tel').classList.add('hidden');
    document.getElementById('wsp-trigger').classList.remove('hidden');
    addItem();
    irPaso1();
  }

  document.addEventListener('DOMContentLoaded', ()=>{
    window.step1 = document.getElementById('step1');
    window.step2 = document.getElementById('step2');
    window.step3 = document.getElementById('step3');
    window.cli_nombre = document.getElementById('cli-nombre');
    window.cli_tel = document.getElementById('cli-tel');
    window.cli_zona = document.getElementById('cli-zona');
    window.cli_dir = document.getElementById('cli-dir');
    window.cli_urgencia = document.getElementById('cli-urgencia');
    window.cli_obs = document.getElementById('cli-obs');
    addItem();
    setupWhatsAppField();
    cargarCatalogo();
    irPaso1();
  });
</script>
</body>
</html>
