<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Corralones y Ferreterías — Materiales Ya</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #eef2f7; color: #1a1a2e; min-height: 100vh; display: flex; flex-direction: column; }
  
  nav { background: #1a2744; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; color: white; }
  nav .logo { color: #fff; font-size: 1.2rem; font-weight: 700; text-decoration: none; }
  .nav-links { display: flex; gap: 10px; }
  .nav-link { padding: 6px 14px; border-radius: 7px; border: 1px solid #2e4a7a; color: #90afd4; font-size: 12px; text-decoration: none; }
  .nav-link:hover { background: #fff; color: #1a2744; }

  .layout { display: flex; flex: 1; height: calc(100vh - 60px); position: relative; }
  .sidebar { width: 340px; background: white; border-right: 1px solid #d0dcea; display: flex; flex-direction: column; z-index: 10; }
  .map-container { flex: 1; height: 100%; background: #ddd; }

  .p-box { padding: 1.25rem; border-bottom: 1px solid #eef2f7; }
  .title-area h1 { font-size: 1.2rem; color: #1a2744; font-weight: 700; margin-bottom: 4px; }
  .title-area p { font-size: 12px; color: #666; }

  .filters-grid { display: flex; gap: 6px; flex-wrap: wrap; padding: 0.75rem 1.25rem; border-bottom: 1px solid #eef2f7; background: #f8fafc; }
  .f-btn { padding: 5px 12px; border-radius: 20px; border: 1px solid #d0dcea; background: white; color: #555; font-size: 11px; cursor: pointer; }
  .f-btn.active { background: #1a2744; color: white; border-color: #1a2744; }

  .list-container { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 10px; }
  .item-card { padding: 1rem; border: 1px solid #eef2f7; border-radius: 10px; background: white; cursor: pointer; transition: all 0.15s; }
  .item-card:hover { border-color: #cbd5e1; background: #f8fafc; }
  .item-name { font-size: 13px; font-weight: 700; color: #1a2744; margin-bottom: 3px; }
  .item-dir { font-size: 11px; color: #666; margin-bottom: 8px; }
  .badge-tipo { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; }

  @media(max-width: 768px) {
    .layout { flex-direction: column-reverse; height: auto; }
    .sidebar { width: 100%; height: 45vh; }
    .map-container { height: 45vh; }
  }
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body>

<nav>
  <a href="index.html" class="logo">🏗 Materiales Ya</a>
  <div class="nav-links">
    <a href="index.html" class="nav-link">Volver al Inicio</a>
  </div>
</nav>

<div class="layout">
  <div class="sidebar">
    <div class="p-box title-area">
      <h1>📍 Comercios de cercanía</h1>
      <p>Seleccioná un rubro para filtrar los corralones locales.</p>
    </div>
    
    <div class="filters-grid">
      <button class="f-btn active" onclick="filtrarMapa('todos', this)">Todos</button>
      <button class="f-btn" onclick="filtrarMapa('corralon', this)">Corralones</button>
      <button class="f-btn" onclick="filtrarMapa('ferreteria', this)">Ferreterías</button>
      <button class="f-btn" onclick="filtrarMapa('durlock', this)">Yeso/Durlock</button>
      <button class="f-btn" onclick="filtrarMapa('maderera', this)">Maderas</button>
    </div>

    <div class="list-container" id="listaComercios">
      <div style="font-size:12px; color:#888; text-align:center; padding:2rem;">Cargando comercios...</div>
    </div>
  </div>
  
  <div class="map-container" id="mapaCompleto"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function() {
  const URL_API = "https://script.google.com/macros/s/AKfycbzMrTkBcCm_oZLuWGqc7U3dhU-aDYQuvtBhb-FVdlROjXn0MfR-QLqjud-G6nPpRYb7KQ/exec";

  const CONFIG_MAP = {
    corralon:   { color: '#1e40af', pin: '🏗', txt: 'Corralón' },
    ferreteria: { color: '#92400e', pin: '🔩', txt: 'Ferretería' },
    durlock:    { color: '#065f46', pin: '📐', txt: 'Drywall/Yeso' },
    maderera:   { color: '#5b21b6', pin: '🪵', txt: 'Maderera' }
  };

  let map, markers = [], todosLosNegocios = [];

  function init() {
    map = L.map('mapaCompleto').setView([-34.62, -58.44], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

    fetch(`${URL_API}?t=${Date.now()}`)
      .then(r => r.json())
      .then(data => {
        if(data && data.status === "success" && Array.isArray(data.corralones)) {
          todosLosNegocios = data.corralones.filter(n => {
            return n && (n.estado || "").toString().toLowerCase().trim() === "activo" && !isNaN(parseFloat(n.lat));
          }).map(n => {
            let t = (n.tipo || "").toLowerCase().trim();
            if (t.includes("madera")) t = "maderera";
            else if (t.includes("seco") || t.includes("durlock")) t = "durlock";
            else if (t.includes("ferreteria")) t = "ferreteria";
            else t = "corralon";
            return { ...n, tipoNormalizado: t, lat: parseFloat(n.lat), lng: parseFloat(n.lng) };
          });
          render(todosLosNegocios);
        }
      }).catch(() => {
        document.getElementById('listaComercios').innerHTML = '<div style="color:red; font-size:12px; text-align:center;">Error al conectar con el servidor.</div>';
      });
  }

  function render(lista) {
    markers.forEach(m => map.removeLayer(m));
    markers = [];
    const contenedor = document.getElementById('listaComercios');
    contenedor.innerHTML = "";

    if(lista.length === 0) {
      contenedor.innerHTML = '<div style="font-size:11px;color:#888;text-align:center;padding:2rem;">No hay comercios en este rubro.</div>';
      return;
    }

    lista.forEach(n => {
      const c = CONFIG_MAP[n.tipoNormalizado] || CONFIG_MAP.corralon;
      
      // Card Izquierda
      const card = document.createElement('div');
      card.className = "item-card";
      card.innerHTML = `
        <div class="item-name">${n.nombre}</div>
        <div class="item-dir">${n.direccion || ""}</div>
        <span class="badge-tipo" style="background:${c.color}20; color:${c.color}">${c.txt}</span>
      `;
      card.onclick = () => {
        map.setView([n.lat, n.lng], 15);
        m.openPopup();
      };
      contenedor.appendChild(card);

      // Pin Mapa
      const icon = L.divIcon({
        html: `<div style="background:${c.color};color:white;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:2px solid white;box-shadow:0 2px 5px rgba(0,0,0,0.2);">${c.pin}</div>`,
        className: '', iconSize: [30,30], iconAnchor: [15,15], popupAnchor: [0,-15]
      });

      const telf = (n.whatsapp || "").toString().replace(/[^0-9]/g, '');
      const numDestino = telf.startsWith('54') ? telf : '549' + telf;
      const msg = encodeURIComponent('Hola ' + n.nombre + ', vi tu negocio en Materiales Ya y te quería consultar por stock.');

      const m = L.marker([n.lat, n.lng], { icon: icon })
        .addTo(map)
        .bindPopup(`<strong>${n.nombre}</strong><br><small>${n.direccion}</small><br><br><a href="https://wa.me/${numDestino}?text=${msg}" target="_blank" style="display:inline-block;padding:4px 10px;background:#25d366;color:white;text-decoration:none;font-size:11px;border-radius:4px;font-weight:700;">WhatsApp 💬</a>`);
      
      markers.push(m);
    });

    if(markers.length > 0) {
      map.fitBounds(L.featureGroup(markers).getBounds().pad(0.1));
    }
  }

  window.filtrarMapa = function(tipo, btn) {
    document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filtrados = tipo === 'todos' ? todosLosNegocios : todosLosNegocios.filter(n => n.tipoNormalizado === tipo);
    render(filtrados);
  };

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
