<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Completo — Materiales Ya</title>
 <link rel="icon" type="image/gif" href="favicon.gif">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #eef2f7; height: 100vh; display: flex; flex-direction: column; }
  nav { background: #1a2744; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; color: white; }
  nav a { color: white; text-decoration: none; font-size: 13px; }
  .layout { display: flex; flex: 1; height: calc(100vh - 54px); }
  .sidebar { width: 320px; background: white; border-right: 1px solid #d0dcea; display: flex; flex-direction: column; padding: 1rem; gap: 10px; overflow-y: auto; }
  .map-container { flex: 1; height: 100%; background: #e2e8f0; position: relative; }
  .item-card { padding: 12px; border: 1px solid #eef2f7; border-radius: 8px; cursor: pointer; background: #f8fafc; }
  .item-card:hover { background: #f1f5f9; }
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body>

<nav>
  <strong>🏗 Materiales Ya — Mapa Completo</strong>
  <a href="index.html">← Volver al Inicio</a>
</nav>

<div class="layout">
  <div class="sidebar" id="listaComercios">
    <div style="font-size:12px; color:#666; text-align:center; padding:2rem;">Cargando lista de comercios...</div>
  </div>
  <div class="map-container" id="mapaCompleto"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const URL_API = "https://script.google.com/macros/s/AKfycbyuXdMIYEa_7a88OhcoUEddFIIc-fNVjpFO_WcP_Oz4DYlYDqtUxzpVgy-HkBD9qFT3lw/exec";
  
  let map = L.map('mapaCompleto').setView([-34.62, -58.44], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
  
  let markers = [];

  fetch(URL_API)
    .then(r => r.json())
    .then(data => {
      if(data && data.status === "success" && Array.isArray(data.corralones)) {
        const contenedor = document.getElementById('listaComercios');
        contenedor.innerHTML = "";

        let conCoordenadas = [];

        data.corralones.forEach(n => {
          // Crear tarjeta lateral siempre
          let card = document.createElement('div');
          card.className = "item-card";
          card.innerHTML = `<strong>${n.nombre}</strong><br><small style="color:#666">${n.direccion || 'Dirección no especificada'}</small>`;
          contenedor.appendChild(card);

          let lat = parseFloat(n.lat);
          let lng = parseFloat(n.lng);

          if(!isNaN(lat) && !isNaN(lng)) {
            conCoordenadas.push({lat, lng, nombre: n.nombre, dir: n.direccion});
            let m = L.marker([lat, lng]).addTo(map).bindPopup(`<strong>${n.nombre}</strong>`);
            markers.push(m);

            card.onclick = () => {
              map.setView([lat, lng], 15);
              m.openPopup();
            };
          } else {
            card.onclick = () => {
              alert(`El comercio "${n.nombre}" no tiene coordenadas de Latitud y Longitud válidas configuradas en la planilla de Google Sheets.`);
            };
          }
        });

        if(markers.length > 0) {
          map.fitBounds(L.featureGroup(markers).getBounds().pad(0.1));
        }
      }
    }).catch(() => {
      document.getElementById('listaComercios').innerHTML = "Error al sincronizar.";
    });
});
</script>
</body>
</html>
