<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materiales Ya — Marketplace</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #eef2f7; color: #1a1a2e; min-height: 100vh; }
    header { background: #1a2744; color: #fff; padding: 1.2rem 2rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
    header h1 { font-size: 1.3rem; font-weight: 600; }
    header p { font-size: 0.8rem; color: #aaa; margin-top: 2px; }
    .hbtn { padding: 7px 14px; border-radius: 7px; border: 1px solid #2e4a7a; color: #90afd4; font-size: 12px; cursor: pointer; text-decoration: none; display: inline-block; transition: all .15s; }
    .hbtn:hover { background: #fff; color: #1a2744; border-color: #fff; }
    main { max-width: 920px; margin: 2rem auto; padding: 0 1rem; }
    .steps { display: flex; margin-bottom: 2rem; }
    .step { flex: 1; text-align: center; position: relative; }
    .step-circle { width: 32px; height: 32px; border-radius: 50%; background: #d0dcea; color: #888; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; margin: 0 auto 6px; position: relative; z-index: 1; transition: all .3s; }
    .step.active .step-circle { background: #1a2744; color: #fff; }
    .step.done .step-circle { background: #1a6a3e; color: #fff; }
    .step-label { font-size: 11px; color: #888; }
    .step.active .step-label, .step.done .step-label { color: #1a1a1a; font-weight: 500; }
    .step::after { content: ''; position: absolute; top: 16px; left: 50%; width: 100%; height: 1px; background: #d0dcea; z-index: 0; }
    .step:last-child::after { display: none; }
    .card { background: #fff; border-radius: 12px; border: 1px solid #d0dcea; padding: 1.5rem; margin-bottom: 1rem; }
    .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1.25rem; }
    .card h3 { font-size: 0.8rem; font-weight: 600; margin-bottom: 0.75rem; color: #555; text-transform: uppercase; letter-spacing: .05em; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; font-weight: 500; }
    .field input, .field select, .field textarea { width: 100%; padding: 9px 12px; border: 1px solid #d0dcea; border-radius: 8px; font-size: 14px; color: #1a1a2e; background: #fafbfd; outline: none; transition: border .15s; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #1a2744; background: #fff; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media(max-width:520px) { .grid-2 { grid-template-columns: 1fr; } }
    .btn-primary { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #1a2744; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity .15s; margin-top: 1rem; }
    .btn-primary:hover { opacity: .85; }
    .btn-secondary { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid #ddd; background: #fff; color: #555; font-size: 14px; cursor: pointer; transition: all .15s; margin-top: 8px; }
    .btn-secondary:hover { background: #eef2f7; }
    .confirm-box { text-align: center; padding: 2rem 1rem; }
    .confirm-icon { font-size: 3rem; margin-bottom: 1rem; }
    .confirm-box h2 { font-size: 1.2rem; font-weight: 600; margin-bottom: .5rem; }
    .confirm-box p { font-size: 14px; color: #666; margin-bottom: 1.5rem; line-height: 1.6; }
    .codigo { font-family: monospace; font-size: 1.5rem; font-weight: 700; background: #eef2f7; padding: 10px 24px; border-radius: 8px; display: inline-block; letter-spacing: 3px; margin-bottom: 1.5rem; }
    .btn-whatsapp { display: block; padding: 13px 24px; border-radius: 8px; background: #25d366; color: #fff; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; margin-top: .5rem; text-align: center; }
    .btn-nuevo { display: block; padding: 11px 24px; border-radius: 8px; background: #fff; color: #555; font-size: 14px; border: 1px solid #ddd; cursor: pointer; margin-top: 8px; width: 100%; text-align: center; }
    .divider { border: none; border-top: 1px solid #f0f0ea; margin: 1.2rem 0; }
    .paso { display: none; }
    .paso.active { display: block; }
    footer { text-align: center; padding: 2rem; font-size: 12px; color: #aaa; }

    .select-wrap{ position: relative; width: 100%; margin-top: 4px; }
    .zona-select{ width: 100%; appearance: none; -webkit-appearance: none; -moz-appearance: none; border: 1px solid #d6deea; border-radius: 12px; background: linear-gradient(180deg, #ffffff 0%, #f5f8fc 100%); color: #1f2a37; padding: 13px 46px 13px 14px; font-size: 14px; line-height: 1.2; box-shadow: 0 1px 2px rgba(16,24,40,.06); outline: none; transition: all .18s ease; }
    .select-wrap::after{ content: "▾"; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #5b6b7f; pointer-events: none; font-size: 14px; }
    .zona-select:hover{ border-color: #b3c2d6; background: #fff; }
    .zona-select:focus{ border-color: #1a2744; box-shadow: 0 0 0 4px rgba(26,39,68,.12); background: #fff; }
    .zona-select optgroup{ font-weight: 700; color: #1a2744; }
    .zona-select option{ color: #1f2a37; }

    .cat-tabs, .mat-tabs, .mats-grid { display: flex; gap: 8px; flex-wrap: wrap; }
    .cat-btn, .mat-btn, .pill-mat { padding: 8px 14px; border: 1px solid #d0dcea; border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px; }
    .cat-btn.active, .mat-btn.active { background: #1a2744; color: #fff; border-color: #1a2744; }
    .mats-grid { padding: 10px; background: #f5f8fc; border-radius: 8px; min-height: 44px; margin-bottom: 1rem; }
    .pill-mat:hover { background: #1a2744; color: #fff; }

    .item-header, .item-row { display: grid; grid-template-columns: 2fr 70px 90px 32px; gap: 6px; align-items: center; }
    .item-header { margin-bottom: 4px; padding: 0 2px; }
    .item-header span { font-size: 11px; color: #aaa; }
    .item-row { margin-bottom: 6px; }
    .item-row input { padding: 7px 10px; border: 1px solid #ddd; border-radius: 7px; font-size: 13px; width: 100%; background: #fafafa; outline: none; }
    .btn-remove { background: none; border: none; color: #ddd; font-size: 18px; cursor: pointer; padding: 2px 6px; border-radius: 5px; line-height: 1; }
    .btn-remove:hover { color: #e53e3e; background: #fff0f0; }
    .btn-add { background: none; border: 1px dashed #ccc; color: #888; font-size: 13px; padding: 7px 14px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 6px; transition: all .15s; }
    .btn-add:hover { border-color: #1a1a1a; color: #1a1a1a; background: #f5f8fc; }

    #ws-launcher, #ws-chat { display: none !important; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>🏗 Materiales Ya</h1>
    <p>Cotizá en varios corralones de tu zona</p>
  </div>
  <div>
    <a href="index.html" class="hbtn">← Inicio</a>
    <a href="calculadores.html" class="hbtn">Calculadores</a>
  </div>
</header>

<main>
  <div id="paso1" class="paso active">
    <div class="steps">
      <div class="step active"><div class="step-circle">1</div><div class="step-label">Tus datos</div></div>
      <div class="step"><div class="step-circle">2</div><div class="step-label">Tu pedido</div></div>
      <div class="step"><div class="step-circle">3</div><div class="step-label">Confirmación</div></div>
    </div>
    <div class="card">
      <h2>¿Dónde entregamos?</h2>
      <div class="grid-2">
        <div class="field"><label>Tu nombre</label><input type="text" id="cli-nombre" placeholder="Juan García"></div>
        <div class="field"><label>WhatsApp</label><input type="tel" id="cli-tel" placeholder="11 1234-5678"></div>
      </div>
      <div class="field">
        <label>Barrio / Zona</label>
        <div class="select-wrap">
          <select id="cli-zona" class="zona-select">
            <option value="">Seleccioná tu zona...</option>
            <option>CABA</option>
            <option>Zona Norte GBA</option>
            <option>Zona Sur GBA</option>
            <option>Zona Oeste GBA</option>
          </select>
        </div>
      </div>
      <div class="field"><label>Dirección de entrega</label><input type="text" id="cli-dir" placeholder="Av. Corrientes 1234"></div>
      <div class="field">
        <label>¿Cuándo necesitás los materiales?</label>
        <select id="cli-urgencia">
          <option value="urgente">Lo antes posible (24-48hs)</option>
          <option value="semana">Esta semana</option>
          <option value="quincena">Esta quincena</option>
          <option value="mes">Este mes</option>
        </select>
      </div>
      <button type="button" class="btn-primary" onclick="irPaso2()">Continuar → Cargar pedido</button>
    </div>
  </div>

  <div id="paso2" class="paso">
    <!-- tu bloque de catálogo y pedido va acá igual que lo tenías -->
  </div>

  <div id="paso3" class="paso">
    <!-- tu bloque de confirmación va acá igual que lo tenías -->
  </div>
</main>

<footer>Materiales Ya — conectando clientes con corralones de tu zona</footer>

<script>
  function irPaso1() {
    document.getElementById('paso1').style.display = 'block';
    document.getElementById('paso2').style.display = 'none';
    document.getElementById('paso3').style.display = 'none';
  }

  function irPaso2() {
    const nombre = document.getElementById('cli-nombre').value.trim();
    const zona = document.getElementById('cli-zona').value;
    if (!nombre) { alert('Ingresá tu nombre para continuar.'); return; }
    if (!zona) { alert('Seleccioná tu zona para continuar.'); return; }
    document.getElementById('paso1').style.display = 'none';
    document.getElementById('paso2').style.display = 'block';
    document.getElementById('paso3').style.display = 'none';
  }
</script>

</body>
</html>
