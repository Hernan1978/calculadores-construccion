<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suma tu Negocio - Materiales Ya</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e293b;
            --accent: #2563eb;
            --success: #16a34a;
            --warning: #ca8a04;
            --danger: #dc2626;
            --gray-light: #f8fafc;
            --gray-border: #e2e8f0;
            --text-main: #334155;
            --sidebar-width: 260px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: var(--text-main);
            min-height: 100vh;
        }

        /* PANTALLA PÚBLICA MEJORADA */
        #pantalla-publica {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 3rem 2rem;
            background-color: var(--primary);
            color: white;
        }

        #pantalla-publica h1 {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        #pantalla-publica .subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
            max-width: 600px;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        /* Grilla de Características */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            max-width: 800px;
            width: 100%;
            margin-bottom: 3rem;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 0.75rem;
            text-align: center;
        }

        .feature-card .icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            display: block;
        }

        .feature-card h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: white;
        }

        .feature-card p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* EL BOTÓN ESCONDIDO (Camuflado abajo a la derecha) */
        .boton-escondido {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.75rem;
            cursor: pointer;
            z-index: 1000;
            user-select: none;
        }
        .boton-escondido:hover {
            color: rgba(255, 255, 255, 0.5);
        }

        /* PANEL DE ADMINISTRACIÓN */
        #panel-admin {
            display: none;
        }

        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--primary);
            color: white;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            padding: 1.5rem 0;
            z-index: 100;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-brand {
            font-size: 1.25rem;
            font-weight: 700;
            padding: 0 1.5rem 1.5rem 1.5rem;
            border-bottom: 1px solid #3341
