<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumá tu Negocio - Materiales Ya</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e293b;
            --accent: #2563eb;
            --success: #16a34a;
            --gray-light: #f8fafc;
            --gray-border: #e2e8f0;
            --text-main: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #f1f5f9; color: var(--text-main); padding: 2rem 1rem; }
        .form-container { max-width: 500px; background: white; padding: 2rem; border-radius: 0.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin: 0 auto; }
        h1 { font-size: 1.75rem; color: var(--primary); margin-bottom: 0.5rem; text-align: center; }
        p.subtitle { color: #64748b; font-size: 0.95rem; text-align: center; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--primary); }
        .form-control { width: 100%; padding: 0.75rem; border: 1px solid var(--gray-border); border-radius: 0.375rem; font-size: 0.95rem; outline: none; background: white; }
        .form-control:focus { border-color: var(--accent); }
        .btn-submit { width: 100%; background: var(--accent); color: white; padding: 0.75rem; border: none; border-radius: 0.375rem; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 1rem; }
        .btn-submit:disabled { background: #94a3b8; }
        .success-box { display: none; background: #dcfce7; border: 1px solid #bbf7d0; color: #166534; padding: 1.5rem; border-radius: 0.5rem; text-align: center; margin-top: 1rem; }
    </style>
</head>
<body>

    <div class="form-container">
        <div id="form-registro">
            <h1>Sumá tu Negocio</h1>
            <p class="subtitle">Llegá a clientes que ya están buscando tus materiales en tu zona.</p>
            
            <form id="nuevo-corralon-form" onsubmit="enviarCorralonASheets(event)">
                <div class="form-group">
                    <label for="nombre">Nombre del Comercio / Corralón</label>
                    <input type="text" id="nombre" class="form-control" required placeholder="Ej: Corralón San Martín">
                </div>
                
                <div class="form-group">
                    <label for="tipo">Tipo de Proveedor</label>
                    <select id="tipo" class="form-control" required>
                        <option value="" disabled selected>Seleccioná una opción</option>
                        <option value="Corralón">Corralón</option>
                        <option value="Cantera / Áridos">Cantera / Áridos</option>
                        <option value="Distribuidor">Distribuidor</option>
                        <option value="Fábrica / Premoldeados">Fábrica / Premoldeados</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="zona">Zona de Cobertura / Localidad</label>
                    <input type="text" id="zona" class="form-control" required placeholder="Ej: Avellaneda y alrededores">
                </div>
                
                <div class="form-group">
                    <label for="whatsapp">Número de WhatsApp (con código de área)</label>
                    <input type="text" id="whatsapp" class="form-control" required placeholder="Ej: 5491112345678">
                </div>
                
                <button type="submit" id="btn-enviar" class="btn-submit">Enviar Solicitud de Alta 🚀</button>
            </form>
        </div>

        <div id="box-exito" class="success-box">
            <h2 style="margin-bottom: 0.5rem;">🎉 ¡Registro Recibido!</h2>
            <p>Tus datos comerciales fueron enviados correctamente.</p>
            <p style="margin-top: 1rem; font-weight: 500;">Nuestro equipo revisará la información y te activará en el panel a la brevedad.</p>
        </div>
    </div>

    <script>
        const URL_API = "https://script.google.com/macros/s/AKfycbzK3E_KfOqNNUAgDJGnmU1sP7uMTJtT6SeH9SJTEWzAIsiX0PsPmO-axcT4l-ksBq019g/exec";

        function enviarCorralonASheets(event) {
            event.preventDefault();
            
            const btn = document.getElementById('btn-enviar');
            btn.disabled = true;
            btn.innerText = "Procesando alta...";

            const datosCorralon = {
                accion: "nuevoCorralon",
                nombre: document.getElementById('nombre').value.trim(),
                tipo: document.getElementById('tipo').value,
                zona: document.getElementById('zona').value.trim(),
                whatsapp: document.getElementById('whatsapp').value.trim()
            };

            fetch(URL_API, {
                method: "POST",
                mode: "cors",
                headers: {
                    "Content-Type": "text/plain"
                },
                body: JSON.stringify(datosCorralon)
            })
            .then(res => res.json())
            .then(respuesta => {
                if(respuesta.status === "success") {
                    document.getElementById('form-registro').style.display = 'none';
                    document.getElementById('box-exito').style.display = 'block';
                } else {
                    alert("Hubo un problema al procesar el registro: " + respuesta.message);
                    btn.disabled = false;
                    btn.innerText = "Enviar Solicitud de Alta 🚀";
                }
            })
            .catch(error => {
                console.error("Error:", error);
                alert("Error de conexión con el servidor de Sheets.");
                btn.disabled = false;
                btn.innerText = "Enviar Solicitud de Alta 🚀";
            });
        }
    </script>
</body>
</html>
