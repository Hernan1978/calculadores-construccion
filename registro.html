<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materiales Ya — Panel de Control</title>
  <link rel="icon" type="image/gif" href="favicon.gif">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #eef2f7; color: #1a1a2e; min-height: 100vh; }
    header { background: #1a2744; color: #fff; padding: 1.2rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.3rem; font-weight: 600; }
    .hbtn { padding: 7px 14px; border-radius: 7px; border: 1px solid #2e4a7a; color: #90afd4; font-size: 12px; cursor: pointer; text-decoration: none; }
    
    main { max-width: 500px; margin: 3rem auto; padding: 0 1rem; }
    .card { background: #fff; border-radius: 12px; border: 1px solid #d0dcea; padding: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
    .card h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 1.25rem; color: #1a2744; text-align: center; }
    
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; font-weight: 500; }
    .field input, .field select { width: 100%; padding: 9px 12px; border: 1px solid #d0dcea; border-radius: 8px; font-size: 14px; outline: none; background: #fafbfd; }
    .field input:focus, .field select:focus { border-color: #1a2744; background: #fff; }
    
    .btn-primary { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #1a2744; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 1rem; }
    .btn-primary:hover { opacity: .85; }
    
    #login-screen { display: block; }
    #admin-panel { display: none; }
  </style>
</head>
<body>

<header>
  <h1>🏗 Panel Interno Administrativo</h1>
  <a href="index.html" class="hbtn">Ir a la Web →</a>
</header>

<main>
  <div id="login-screen" class="card">
    <h2>Ingreso Autorizado</h2>
    <div class="field">
      <label>Contraseña del Sistema</label>
      <input type="password" id="pass-input" placeholder="••••••••">
    </div>
    <button class="btn-primary" onclick="verificarPassword()">Entrar al Panel</button>
  </div>

  <div id="admin-panel" class="card">
    <h2>Alta de Nuevo Corralón</h2>
    <form id="form-corralon" onsubmit="guardarCorralon(event)">
      <div class="field">
        <label>Nombre del Corralón</label>
        <input type="text" id="c-nombre" required placeholder="Ej: Corralón San Martín">
      </div>
      <div class="field">
        <label>Dirección</label>
        <input type="text" id="c-dir" required placeholder="Ej: Av. Mitre 2341">
      </div>
      <div class="field">
        <label>Barrio / Zona</label>
        <input type="text" id="c-zona" required placeholder="Ej: Avellaneda">
      </div>
      <div class="field">
        <label>Teléfono (WhatsApp)</label>
        <input type="text" id="c-tel" placeholder="Ej: 5491112345678">
      </div>
      <div class="field">
        <label>Latitud</label>
        <input type="text" id="c-lat" placeholder="Ej: -34.6621">
      </div>
      <div class="field">
        <label>Longitud</label>
        <input type="text" id="c-lng" placeholder="Ej: -58.3645">
      </div>
      <button type="submit" class="btn-primary">Guardar en Google Sheets</button>
    </form>
  </div>
</main>

<script>
  // Tu enlace de Google Apps Script unificado
  const URL_API = "https://script.google.com/macros/s/AKfycbxD8b7sU8kjYFAiAHX_PdjJ66SQtEI4It0-jT6cO71YoxAUvBx4hwSHQ29LHWLekNLvVg/exec";

  // Tu contraseña fijada para que no falle
  const PASS_CORRECTA = "admin1234"; 

  function verificarPassword() {
    const input = document.getElementById('pass-input').value;
    if (input === PASS_CORRECTA) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'block';
    } else {
      alert('Contraseña incorrecta. Intente nuevamente.');
    }
  }

  async function guardarCorralon(event) {
    event.preventDefault();
    
    const datos = {
      nombre: document.getElementById('c-nombre').value,
      direccion: document.getElementById('c-dir').value,
      zona: document.getElementById('c-zona').value,
      telefono: document.getElementById('c-tel').value,
      latitud: document.getElementById('c-lat').value,
      longitud: document.getElementById('c-lng').value
    };

    try {
      await fetch(URL_API, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos)
      });
      
      alert('¡Corralón enviado! Revisá tu Google Sheets en unos segundos.');
      document.getElementById('form-corralon').reset();
    } catch (e) {
      console.error(e);
      alert('Error al conectar con la base de datos.');
    }
  }
</script>
</body>
</html>
