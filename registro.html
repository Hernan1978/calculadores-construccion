<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacer Pedido - Materiales Ya</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e293b;
            --accent: #2563eb;
            --success: #16a34a;
            --gray-light: #f8fafc;
            --gray-border: #e2e8f0;
            --text-main: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #f1f5f9; color: var(--text-main); padding: 2rem 1rem; }
        .form-container { max-width: 500px; background: white; padding: 2rem; border-radius: 0.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin: 0 auto; }
        h1 { font-size: 1.75rem; color: var(--primary); margin-bottom: 0.5rem; text-align: center; }
        p.subtitle { color: #64748b; font-size: 0.95rem; text-align: center; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--primary); }
        .form-control { width: 100%; padding: 0.75rem; border: 1px solid var(--gray-border); border-radius: 0.375rem; font-size: 0.95rem; outline: none; }
        .form-control:focus { border-color: var(--accent); }
        textarea.form-control { resize: vertical; min-height: 100px; }
        .btn-submit { width: 100%; background: var(--accent); color: white; padding: 0.75rem; border: none; border-radius: 0.375rem; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 1rem; }
        .btn-submit:disabled { background: #94a3b8; }
        .success-box { display: none; background: #dcfce7; border: 1px solid #bbf7d0; color: #166534; padding: 1.5rem; border-radius: 0.5rem; text-align: center; margin-top: 1rem; }
    </style>
</head>
<body>

    <div class="form-container">
        <div id="form-pedido">
            <h1>Solicitar Materiales</h1>
            <p class="subtitle">Completá tus datos y recibí presupuestos de corralones en tu zona al instante.</p>
            
            <form id="nuevo-pedido-form" onsubmit="enviarPedidoASheets(event)">
                <div class="form-group">
                    <label for="cliente">Tu Nombre y Apellido</label>
                    <input type="text" id="cliente" class="form-control" required placeholder="Ej: Juan Pérez">
                </div>
                
                <div class="form-group">
                    <label for="zona">Zona / Localidad de Entrega</label>
                    <input type="text" id="zona" class="form-control" required placeholder="Ej: Avellaneda">
                </div>
                
                <div class="form-group">
                    <label for="materiales">¿Qué materiales necesitás?</label>
                    <textarea id="materiales" class="form-control" required placeholder="Ej: 50 bolsas de cemento, 3 de cal, 1 camionada de arena..."></textarea>
                </div>
                
                <button type="submit" id="btn-enviar" class="btn-submit">Enviar Solicitud 🚀</button>
            </form>
        </div>

        <div id="box-exito" class="success-box">
            <h2 style="margin-bottom: 0.5rem;">🎉 ¡Solicitud Enviada!</h2>
            <p>Tu pedido fue registrado en el sistema con el identificador:</p>
            <h3 id="codigo-pedido" style="margin: 1rem 0; color: var(--success); font-size: 1.5rem;">MY-0000</h3>
            <p style="font-size: 0.85rem; color: #64748b;">Guardá este código para hacer el seguimiento en el panel.</p>
        </div>
    </div>

    <script>
        const URL_API = "https://script.google.com/macros/s/AKfycbzN4rgXHP02RxAXHYZrNq7iO7dmUcJdLlHxYFeRk8vtm4qH6C3vA97PVxh3ZfRD3QyE/exec";

        function enviarPedidoASheets(event) {
            event.preventDefault();
            
            const btn = document.getElementById('btn-enviar');
            btn.disabled = true;
            btn.innerText = "Procesando...";

            const datosPedido = {
                accion: "nuevoPedido",
                cliente: document.getElementById('cliente').value.trim(),
                zona: document.getElementById('zona').value.trim(),
                materiales: document.getElementById('materiales').value.trim()
            };

            fetch(URL_API, {
                method: "POST",
                mode: "cors",
                headers: {
                    "Content-Type": "text/plain"
                },
                body: JSON.stringify(datosPedido)
            })
            .then(res => res.json())
            .then(respuesta => {
                if(respuesta.status === "success") {
                    document.getElementById('form-pedido').style.display = 'none';
                    document.getElementById('codigo-pedido').innerText = respuesta.id;
                    document.getElementById('box-exito').style.display = 'block';
                } else {
                    alert("Hubo un problema al procesar el pedido: " + respuesta.message);
                    btn.disabled = false;
                    btn.innerText = "Enviar Solicitud 🚀";
                }
            })
            .catch(error => {
                console.error("Error:", error);
                alert("Error de conexión con el servidor de Sheets.");
                btn.disabled = false;
                btn.innerText = "Enviar Solicitud 🚀";
            });
        }
    </script>
</body>
</html>
